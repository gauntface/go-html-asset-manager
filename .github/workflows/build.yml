on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Test
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version: '^1.17.3'
    - name: NPM Deps
      run: npm install
    - name: Run Test
      run: make test
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
      with:
        file: ./coverage/cover.out
        github-token: ${{ secrets.GITHUB_TOKEN }}
